# Spark's own logging: warnings and errors only, and silence known-harmless messages.
rootLogger.level = warn
rootLogger.appenderRef.stderr.ref = console
appender.console.type = Console
appender.console.name = console
appender.console.target = SYSTEM_ERR
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{HH:mm:ss} %-5p %c{1} | %m%n

# The raw CSV is read with positional column names (raw_*), so the header never "matches".
# Ingest already validated the header against the contract (SOURCE_HEADER).
logger.csvheader.name = org.apache.spark.sql.catalyst.csv.CSVHeaderChecker
logger.csvheader.level = error
logger.nativecode.name = org.apache.hadoop.util.NativeCodeLoader
logger.nativecode.level = error
logger.metrics.name = org.apache.hadoop.metrics2
logger.metrics.level = error
logger.planstring.name = org.apache.spark.sql.catalyst.util.SparkStringUtils
logger.planstring.level = error
