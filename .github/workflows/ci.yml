name: CI

on:
  push:
    branches: [main]
  pull_request:

# The workflow only reads the repo; nothing in it can push, comment or publish.
permissions:
  contents: read

jobs:
  unit:
    name: Lint + unit tests
    runs-on: ubuntu-24.04   # pinned: "latest" moves to Ubuntu 26 in October 2026
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-java@v5   # Spark runs on the JVM
        with:
          distribution: temurin
          java-version: "17"
      - run: pip install -r requirements-dev.txt
      - run: ruff check .   # includes the bandit security rules ("S")
      - run: pytest tests/unit

  security:
    name: Security scans
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # the secret scan reads the whole git history, not just the last commit
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Leaked secrets (gitleaks, every commit)
        run: make scan-secrets
      - name: Vulnerable Python dependencies (pip-audit)
        run: |
          pip install pip-audit==2.10.1
          pip-audit -r requirements-dev.txt
      - name: Dockerfile misconfigurations (trivy)
        run: make scan-config

  e2e:
    name: End-to-end (Docker Compose)
    runs-on: ubuntu-24.04   # pinned: "latest" moves to Ubuntu 26 in October 2026
    needs: unit
    steps:
      - uses: actions/checkout@v5
      - run: cp .env.example .env
      - run: docker compose build pipeline
      - run: docker compose up -d --wait objectstore postgres
      - run: docker compose run --rm -T pipeline pytest tests/e2e
      - name: Service logs
        if: failure()
        run: docker compose logs
