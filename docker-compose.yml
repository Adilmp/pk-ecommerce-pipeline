# The whole stack: one command starts the data lake and the warehouse (decision D13).
# The pipeline container is a "job": it runs a command and exits (`docker compose run`).
name: pk-ecommerce

# Security (decision D27): every port is published on 127.0.0.1 only, so the services are
# reachable from this machine but not from the rest of the network. The default passwords in
# .env.example, the no-login Airflow UI and the Postgres superuser are safe only because of this.
# Every container also runs with no-new-privileges (setuid binaries can't raise privileges).

services:
  # S3-compatible object storage = the data lake. RustFS replaces MinIO, whose images were
  # removed from Docker Hub in Sept 2026. The code only speaks the S3 API, so the swap was
  # a config change (decisions D4, D14).
  objectstore:
    image: rustfs/rustfs:1.0.0
    security_opt: ["no-new-privileges:true"]
    environment:
      RUSTFS_ACCESS_KEY: ${AWS_ACCESS_KEY_ID}
      RUSTFS_SECRET_KEY: ${AWS_SECRET_ACCESS_KEY}
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "127.0.0.1:9000:9000"   # S3 API
      - "127.0.0.1:9001:9001"   # web console
    volumes:
      - lake-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9000/health >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  # The warehouse (gold layer). Stands in for Redshift / BigQuery locally (D12).
  postgres:
    image: postgres:16-alpine
    security_opt: ["no-new-privileges:true"]
    environment:
      POSTGRES_USER: ${PGUSER}
      POSTGRES_PASSWORD: ${PGPASSWORD}
      POSTGRES_DB: ${PGDATABASE}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - warehouse-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER} -d ${PGDATABASE}"]
      interval: 5s
      timeout: 3s
      retries: 20

  # The pipeline: Python + Java + Spark. The repo is mounted, so code edits need no rebuild.
  pipeline:
    build:
      context: .
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    image: pk-ecommerce-pipeline:latest
    security_opt: ["no-new-privileges:true"]
    env_file: .env
    environment:
      HOME: /home/app
      SPARK_CONF_DIR: /app/conf
    volumes:
      - .:/app
    ports:
      - "127.0.0.1:4040:4040"   # Spark UI while a job is running
    depends_on:
      objectstore:
        condition: service_healthy
      postgres:
        condition: service_healthy
    profiles: ["job"]

  # Optional: Airflow scheduling the same pipeline, one DAG run per month (`make airflow`).
  airflow:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    image: pk-ecommerce-airflow:latest
    security_opt: ["no-new-privileges:true"]
    env_file: .env
    environment:
      HOME: /home/app
      SPARK_CONF_DIR: /app/conf
      SPARK_DRIVER_MEMORY: 1g
      AIRFLOW__CORE__DAGS_FOLDER: /app/airflow/dags
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      # Start the DAG straight away: every step is idempotent, so the backfill is safe to run.
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${PGUSER}:${PGPASSWORD}@postgres:5432/airflow
      # Local demo only: every visitor to the UI is an admin, no login.
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
    volumes:
      - .:/app
    ports:
      - "127.0.0.1:8080:8080"   # Airflow UI
    depends_on:
      objectstore:
        condition: service_healthy
      postgres:
        condition: service_healthy
    profiles: ["airflow"]

volumes:
  lake-data:
  warehouse-data:
